<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Japan - Learn Japanese</title>
    
    <!-- Google Fonts - Cute & Rounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/start.css">
</head>
<body class="start-page">
    <div class="container">
        <div class="start-wrapper">
            <!-- Decorations -->
            <div class="decoration decoration-bow top-left"></div>
            <div class="decoration decoration-flower top-right"></div>
            <div class="decoration decoration-goldfish bottom-left"></div>
            <div class="decoration decoration-sticker bottom-right"></div>

            <!-- Main Content -->
            <div class="start-content">
                <!-- Header -->
                <div class="start-header">
                    <h1 class="main-title">MINE JAPAN</h1>
                    <p class="subtitle">日本語 NOTEBOOK</p>
                </div>

                <!-- Description -->
                <div class="start-description">
                    <p>Learn Japanese</p>
                    <p>from zero.</p>
                </div>

                <!-- Button -->
                <button class="btn btn-primary start-button" onclick="goToCoursePage()">
                    <span>START LEARNING</span>
                </button>

                <!-- Info -->
                <div class="start-info">
                    <span class="lesson-count">✿ 300 Lessons ✿</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
